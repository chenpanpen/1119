<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模擬刷卡頁面</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>模擬刷卡</h1>
    <p class="notice">僅供教學，不輸入真實卡片資料（教學測試序列：1234 5678 1234 5670）</p>

    <form id="payment-form" novalidate>
      <div class="field">
        <label for="card-number">測試卡號</label>
        <input id="card-number" inputmode="numeric" placeholder="1234 5678 1234 5670">
        <small class="error" id="card-error"></small>
      </div>

      <div class="row">
        <div class="field">
          <label for="expiry">有效期限 MM/YY</label>
          <input id="expiry" placeholder="12/29">
          <small class="error"></small>
        </div>

        <div class="field">
          <label for="cvv">安全碼</label>
          <input id="cvv" inputmode="numeric" placeholder="123">
          <small class="error"></small>
        </div>
      </div>

      <div class="field">
        <label for="amount">金額</label>
        <input id="amount" type="number" placeholder="850">
        <small class="error"></small>
      </div>

      <button type="submit">模擬付款</button>
      <p id="result" class="result"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
